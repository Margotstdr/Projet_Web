<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="800" height="520" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Schéma de la base de données — GestionPermanences</text>

  <!-- === Enseignants === -->
  <rect x="30" y="60" width="200" height="170" rx="8" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <rect x="30" y="60" width="200" height="32" rx="8" fill="#2980b9"/>
  <rect x="30" y="84" width="200" height="8" fill="#2980b9"/>
  <text x="130" y="81" text-anchor="middle" fill="white" font-weight="bold">Enseignants</text>
  <text x="45" y="115" fill="#1a252f">🔑 id_ens (PK)</text>
  <text x="45" y="133" fill="#1a252f">nom_ens</text>
  <text x="45" y="151" fill="#1a252f">prenom_ens</text>
  <text x="45" y="169" fill="#1a252f">login_ens</text>
  <text x="45" y="187" fill="#1a252f">mdp_ens</text>
  <text x="45" y="205" fill="#1a252f">mail_ens</text>

  <!-- === Etudiant === -->
  <rect x="570" y="60" width="200" height="170" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <rect x="570" y="60" width="200" height="32" rx="8" fill="#27ae60"/>
  <rect x="570" y="84" width="200" height="8" fill="#27ae60"/>
  <text x="670" y="81" text-anchor="middle" fill="white" font-weight="bold">Etudiant</text>
  <text x="585" y="115" fill="#1a252f">🔑 id_etu (PK)</text>
  <text x="585" y="133" fill="#1a252f">nom_etu</text>
  <text x="585" y="151" fill="#1a252f">prenom_etu</text>
  <text x="585" y="169" fill="#1a252f">login_etu</text>
  <text x="585" y="187" fill="#1a252f">mdp_etu</text>
  <text x="585" y="205" fill="#1a252f">mail_etu</text>

  <!-- === Permanence === -->
  <rect x="280" y="60" width="240" height="190" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <rect x="280" y="60" width="240" height="32" rx="8" fill="#e67e22"/>
  <rect x="280" y="84" width="240" height="8" fill="#e67e22"/>
  <text x="400" y="81" text-anchor="middle" fill="white" font-weight="bold">Permanence</text>
  <text x="295" y="115" fill="#1a252f">🔑 id_perm (PK)</text>
  <text x="295" y="133" fill="#1a252f">matiere_perm</text>
  <text x="295" y="151" fill="#1a252f">heure_perm</text>
  <text x="295" y="169" fill="#1a252f">salle_perm</text>
  <text x="295" y="187" fill="#1a252f">date_perm</text>
  <text x="295" y="205" fill="#1a252f">🔗 id_ens_responsable (FK)</text>

  <!-- === Presenter === -->
  <rect x="80" y="340" width="200" height="100" rx="8" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
  <rect x="80" y="340" width="200" height="32" rx="8" fill="#8e44ad"/>
  <rect x="80" y="364" width="200" height="8" fill="#8e44ad"/>
  <text x="180" y="361" text-anchor="middle" fill="white" font-weight="bold">Presenter</text>
  <text x="95" y="395" fill="#1a252f">🔗 id_ens (FK, PK)</text>
  <text x="95" y="413" fill="#1a252f">🔗 id_perm (FK, PK)</text>

  <!-- === Inscrit === -->
  <rect x="510" y="340" width="210" height="115" rx="8" fill="#fdfefe" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="510" y="340" width="210" height="32" rx="8" fill="#7f8c8d"/>
  <rect x="510" y="364" width="210" height="8" fill="#7f8c8d"/>
  <text x="615" y="361" text-anchor="middle" fill="white" font-weight="bold">Inscrit</text>
  <text x="525" y="395" fill="#1a252f">🔗 id_etu (FK, PK)</text>
  <text x="525" y="413" fill="#1a252f">🔗 id_perm (FK, PK)</text>
  <text x="525" y="431" fill="#1a252f">date_inscription</text>

  <!-- Arrow: Permanence.id_ens_responsable → Enseignants.id_ens -->
  <line x1="280" y1="200" x2="230" y2="200" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>

  <!-- Arrow: Presenter.id_ens → Enseignants -->
  <line x1="130" y1="340" x2="100" y2="230" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>

  <!-- Arrow: Presenter.id_perm → Permanence -->
  <line x1="260" y1="390" x2="350" y2="250" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>

  <!-- Arrow: Inscrit.id_etu → Etudiant -->
  <line x1="670" y1="340" x2="670" y2="230" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- Arrow: Inscrit.id_perm → Permanence -->
  <line x1="560" y1="390" x2="480" y2="250" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>

  <!-- Légende -->
  <rect x="30" y="470" width="740" height="36" rx="6" fill="#eaecee"/>
  <text x="50" y="491" fill="#555" font-size="12">🔑 Clé primaire</text>
  <text x="180" y="491" fill="#555" font-size="12">🔗 Clé étrangère</text>
  <text x="310" y="491" fill="#555" font-size="12">- - - Relation (FK)</text>
  <text x="450" y="491" fill="#555" font-size="12">Base : GestionPermanences (MySQL)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2980b9"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>
